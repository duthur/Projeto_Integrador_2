<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTerminal Escolar</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        h1 { color: #4CAF50; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 400px; margin: 30px auto; }
        button { background-color: #1e1e1e; color: #fff; border: 2px solid #333; padding: 25px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #333; border-color: #4CAF50; }
        button.danger { border-color: #f44336; }
        #status { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; font-weight: bold; }
        .success { background-color: #2e7d32; color: #fff; }
    </style>
</head>
<body>
    <h1>📱 EcoTerminal Escolar</h1>
    <p>Sala 01 - Selecione o chamado necessário:</p>

    <div class="grid">
        <button onclick="enviarChamado('Chamar Professor')">👨‍🏫 Chamar Professor</button>
        <button onclick="enviarChamado('Suporte TI')">💻 Suporte TI</button>
        <button onclick="enviarChamado('Limpeza')">🧹 Solicitar Limpeza</button>
        <button class="danger" onclick="enviarChamado('Emergência Médica')">🚨 Emergência</button>
    </div>

    <div id="status"></div>

    <script>
        function enviarChamado(tipo) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'success';
            statusDiv.style.display = 'block';
            statusDiv.innerText = `✅ Alerta enviado: "${tipo}" registrado com sucesso no painel da diretoria!`;
            setTimeout(() => { statusDiv.style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
